<!doctype html>
<html lang="pl" data-mode="dark" data-palette="gemini">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kalkulator naukowy</title>
<!-- KaTeX: ślad jednostek w drugiej linii wyniku -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous" onload="window.onKatexLoaded && window.onKatexLoaded()"></script>
<!-- Wspólna paleta Gemini z repo darkpdf (na GitHub Pages i w server.js leży obok: /darkpdf/) -->
<link rel="stylesheet" href="../darkpdf/theme.css">
<link rel="stylesheet" href="calc.css">
<style>
  /* tło poza kalkulatorem (np. przy przewinięciu) w kolorze motywu */
  html { color-scheme: dark; background: Canvas; }
  html[data-mode="light"] { color-scheme: light; }
  html[data-mode="dark"][data-palette="gemini"] { background: var(--gem-bg, #0b0c0d); }
  body { margin: 0; }
  #calc-app, #calc-app.calc-root { min-height: 100vh; }
</style>
</head>
<body>
<div id="calc-app"></div>

<script type="module">
  import { mountCalculator } from './calc-app.js';

  const calc = mountCalculator(document.getElementById('calc-app'), { isEmbedded: false });

  const initialExpr = new URLSearchParams(location.search).get('expr');
  if (initialExpr) {
    calc.run(initialExpr);
  } else if (matchMedia('(pointer: fine)').matches) {
    calc.focus();
  }

  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>
</body>
</html>
