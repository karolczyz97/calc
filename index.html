<!doctype html>
<html lang="pl" data-mode="dark" data-palette="gemini">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0f0f0f">
<title>Kalkulator naukowy</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<!-- KaTeX (ślad jednostek) ładuje calc-app.js z lib/katex – lokalnie, więc działa offline -->
<!-- Wspólna paleta Gemini z repo darkpdf (na GitHub Pages i w server.js leży obok: /darkpdf/) -->
<link rel="stylesheet" href="../darkpdf/theme.css">
<link rel="stylesheet" href="calc.css">
<style>
  /* tło poza kalkulatorem (np. przy przewinięciu) w kolorze motywu */
  html { color-scheme: dark; background: Canvas; }
  html[data-mode="light"] { color-scheme: light; }
  html[data-palette="gemini"] { background: var(--gem-bg, #0f0f0f); }
  body { margin: 0; }
  #calc-app, #calc-app.calc-root { min-height: 100vh; min-height: 100dvh; }   /* dvh: bez paska adresu telefonu */
</style>
</head>
<body>
<div id="calc-app"></div>

<script type="module">
  import { mountCalculator } from './calc-app.js';

  const calc = mountCalculator(document.getElementById('calc-app'), { isEmbedded: false });

  const initialExpr = new URLSearchParams(location.search).get('expr');
  if (initialExpr) {
    calc.run(initialExpr);
  } else if (matchMedia('(pointer: fine)').matches) {
    calc.focus();
  }

  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>
</body>
</html>
